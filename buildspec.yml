
version: 0.2



phases:

  pre_build:

    commands:

      - echo "Logging in to Amazon ECR..."

      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

      - IMAGE_TAG=${COMMIT_HASH:=latest}

      - REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME

  build:

    commands:

      - echo "Building Docker image $REPO_URI:$IMAGE_TAG..."

      - docker build -t $REPO_URI:latest -t $REPO_URI:$IMAGE_TAG .

  post_build:

    commands:

      - echo "Pushing Docker images to Amazon ECR..."

      - docker push $REPO_URI:latest

      - docker push $REPO_URI:$IMAGE_TAG

      - echo "Build completed successfully."

